name: engine-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: swift --version
      - run: swift test --package-path engines/xray
      - run: swift test --package-path engines/singbox
